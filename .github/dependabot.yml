version: 2
updates:
  # NPM

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    allow:
      - dependency-type: 'direct'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      postcss:
        patterns:
          - 'postcss*'
          - '@csstools/postcss-*'
        exclude-patterns:
          # см. группу webpack
          - 'postcss-loader'
      webpack:
        patterns:
          - 'webpack*'
          - '@types/webpack'
          - 'postcss-loader'
          - 'style-loader'
          - 'swc-loader'
          - 'css-loader'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@typescript-eslint/*'
      stylelint:
        patterns:
          - 'stylelint*'
          - '@vkontakte/stylelint-config'
      vitest:
        patterns:
          - 'vitest*'
          - '@vitest*'
      testing-library:
        patterns:
          - '@testing-library/*'
      size-limit:
        patterns:
          - 'size-limit'
          - '@size-limit/*'
      swc:
        patterns:
          - '@swc/*'
          - 'swc-plugin-*'
      rspack:
        patterns:
          - '@rspack/*'
      next:
        patterns:
          - 'next'
          - '@next/*'
    versioning-strategy: increase
    open-pull-requests-limit: 20

  # GitHub Actions

  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'daily'

  # Devcontainer

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
