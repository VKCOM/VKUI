#
# Требования:
# - Тесты должны запускаться при каждом изменении в ветке, чтобы корректно рассчитывалось покрытие тестами при
#   последующих изменениях.
# - В джобах точечно указываем пакеты, для которых проверяется покрытие.
#

name: Branch test coverage

run-name: Check ${{ github.ref_name }} branch test coverage

on:
  push:
    branches:
      - master
      - '*-stable'

concurrency:
  group: branch-test-coverage-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Создаем кэш для LFS в мастере, чтобы другие ветки могли его получить.
  # Кэш требуется для того, чтобы не превышать лимиты GitHub
  lfs:
    runs-on: ubuntu-slim
    name: Create LFS cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout LFS objects
        uses: $/.github/actions/lfs
        with:
          apt_mirror: ${{ vars.APT_MIRROR }}

  test:
    name: Call reusable unit tests workflow
    uses: ./.github/workflows/reusable_workflow_test.yml
    with:
      workspace: '@vkontakte/vkui'

  test_e2e:
    name: Call reusable e2e tests workflow
    permissions:
      contents: read
      id-token: write
      code-quality: write
    uses: ./.github/workflows/reusable_workflow_test_e2e.yml

  deploy_test_coverage:
    if: ${{ !cancelled() && (success() || failure()) }}
    needs: test
    runs-on: ubuntu-slim
    name: Deploy test coverage
    permissions:
      id-token: write
      code-quality: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download test artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: test-output

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          flags: unittests
          files: .nyc_output/coverage-final.json
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage to GitHub
        # `actions/upload-code-coverage` требует pull-request-number для не-дефолтных веток,
        # но при прямом пуше в stable-ветку PR отсутствует, и загрузка падает с HTTP 400.
        # Поэтому загружаем coverage в GitHub только для дефолтной ветки (master).
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-code-coverage@v1.4.4
        with:
          file: .nyc_output/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
