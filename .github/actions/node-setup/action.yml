name: Workflow / Setup NodeJS
description: It setting up the NodeJS

runs:
  using: composite
  steps:
    - name: Enable Corepack
      run: |
        if ! command -v corepack > /dev/null 2>&1; then
          # Replace standalone Yarn binaries provided by the container image.
          npm install --global --force corepack@0.36.0
        fi
        corepack enable
      shell: bash

    - name: Setup NodeJS
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'

    - name: Install dependencies
      run: YARN_ENABLE_SCRIPTS=false YARN_ENABLE_HARDENED_MODE=0 yarn install --immutable
      shell: bash
